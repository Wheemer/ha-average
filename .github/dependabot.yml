version: 2
multi-ecosystem-groups:
  test-stack:
    schedule:
      interval: weekly
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    github-actions:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /
  patterns:
  - '*'
  multi-ecosystem-group: test-stack
- package-ecosystem: docker
  directory: /tests
  patterns:
  - '*'
  multi-ecosystem-group: test-stack
