version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    development-tools:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /tests
  schedule:
    interval: weekly
