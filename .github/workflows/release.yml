name: Release
on:
  push:
    tags:
      - '[v0-9]+.[0-9]+*'
permissions:
  contents: read
jobs:
  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package integration
        working-directory: custom_components/average
        run: zip -r "$RUNNER_TEMP/average.zip" . -x '__pycache__/*' '*.pyc'
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ runner.temp }}/average.zip
          generate_release_notes: true
