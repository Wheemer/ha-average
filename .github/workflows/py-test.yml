name: Python testing
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Python checks (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependencies: [fixtures, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install maintained fixture baseline
        run: python -m pip install -r requirements-dev.txt
      - name: Test newer pytest-asyncio compatibility
        if: matrix.dependencies == 'latest'
        # This is an explicit forward-compatibility test. The other matrix job
        # retains pytest-homeassistant's exact dependency pins.
        run: python -m pip install --no-deps -r requirements-test-latest.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format . --check
      - name: Test package
        run: >-
          python -m pytest -n 2 --dist=loadfile -q --durations=10
          --tb=short --show-capture=no --disable-warnings --maxfail=3
