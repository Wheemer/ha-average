name: Python testing
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated test environment
        run: docker build --pull -f tests/Dockerfile -t average-ci .
      - name: Ruff lint
        run: docker run --rm --network none -v "$PWD:/work" average-ci -m ruff check .
      - name: Ruff format
        run: docker run --rm --network none -v "$PWD:/work" average-ci -m ruff format . --check
      - name: Test package on native Home Assistant
        run: >-
          docker run --rm --network none -v "$PWD:/work" average-ci
          -m pytest -q --tb=short --show-capture=no --disable-warnings
          --cov=custom_components.average --cov-report=term-missing
          --maxfail=3
