repos:
  - repo: local
    hooks:
      - id: manifest
        name: Check manifest metadata
        entry: scripts/update_manifest --check
        language: script
        pass_filenames: false
        files: ^(custom_components/average/(const\.py|manifest\.json)|requirements-runtime\.txt|hacs\.json|scripts/metadata\.py)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-format
        files: ^(custom_components|bin|tests)/.+\.py$
      - id: ruff-check
        args: [ --fix ]
        files: ^(custom_components|bin|tests)/.+\.py$
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.2
    hooks:
      - id: pyupgrade
        args: [ --py312-plus ]
        stages: [manual]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - --quiet
          - --format=custom
          - --configfile=tests/bandit.yaml
        files: ^custom_components/.+\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [manual]
      - id: check-json
        files: ^(custom_components|tests)/.+\.json$
      - id: trailing-whitespace
      # Uncomment lines below if you want to follow classical GitHub flow style development
#      - id: no-commit-to-branch
#        args:
#          - --branch=dev
  - repo: local
    hooks:
      # Run mypy through our wrapper script in order to get the possible
      # pyenv and/or virtualenv activated; it may not have been e.g. if
      # committing from a GUI tool that was not launched from an activated
      # shell.
      - id: mypy
        name: mypy
        entry: scripts/run-in-env python scripts/typecheck.py
        pass_filenames: false
        language: script
        types: [python]
        require_serial: true
        files: ^custom_components/.+\.py$
      # Uncomment lines below to test code on every commit
      - id: pytest
        name: pytest
        entry: scripts/run-in-env pytest
        language: system
        pass_filenames: false
        always_run: true
